name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force
      - name: Run unit tests (no tenant connection)
        shell: pwsh
        run: Invoke-Pester -Path './Tests' -CI -Output Detailed
      - name: Install Graph Authentication dependency for module validation
        shell: pwsh
        run: Install-Module Microsoft.Graph.Authentication -Repository PSGallery -Scope CurrentUser -MinimumVersion 2.0.0 -Force
      - name: Stage and validate PowerShell Gallery module (no publication)
        shell: pwsh
        run: |
          .\Tools\Build-Module.ps1
          $manifest = Join-Path $PWD 'dist/ConditionalAccessBuilder/ConditionalAccessBuilder.psd1'
          $package = Test-ModuleManifest -Path $manifest -ErrorAction Stop
          if ($package.Version.ToString() -ne '1.0.0') { throw 'Unexpected module version' }
          Import-Module $manifest -Force -ErrorAction Stop
          $command = Get-Command Start-ConditionalAccessBuilder -ErrorAction Stop
          if ($command.Source -ne 'ConditionalAccessBuilder') { throw 'Unexpected module command source' }
          $files = @(Get-ChildItem 'dist/ConditionalAccessBuilder' -File -Recurse)
          if ($files.Count -ne 10) { throw "Unexpected packaged file count: $($files.Count)" }
          Write-Host "Module staged, manifest valid and command import successful. GUI deployment not executed."
